; Settings for the recomp launcher (launcher\ submodule, built as pgr4_launcher.exe).
; Format: launcher\README.md. Your choices are saved to launcher.user.ini (not committed).
; Settings given here are passed as command-line cvars, which override pgr4recomp.toml.

[game]
title=Project Gotham Racing 4
subtitle=Static recompilation (Xbox 360, ReXGlue)
exe=out\build\win-amd64-release\pgr4recomp.exe
workdir={exe_dir}
args=--game_data_root="{root}\assets" --log_file="{root}\work\play.log"
log=work\play.log
console=0

[require]
assets\default.xex=Extract the disc into pgr4_files (the assets junction), see README.md.

[setting.fullscreen]
group=Display
label=Fullscreen
type=bool
arg=--fullscreen={value}
default=false

[setting.window_width]
group=Display
label=Window width
type=int
arg=--window_width={value}
min=320
max=8192
default=1280

[setting.window_height]
group=Display
label=Window height
type=int
arg=--window_height={value}
min=240
max=8192
default=720

[setting.title_stats]
group=Display
label=Show fps, draws and triangles in the title bar
type=bool
arg=--pgr4_title_stats={value}
default=true

[setting.fps60]
group=Graphics
label=60 fps
type=bool
arg=--pgr4_60fps={value}
default=true
help=Present every vblank instead of the game's 30 fps lock. Gameplay runs in real time either way.

[setting.adaptive_vsync]
group=Graphics
label=Adaptive vsync
type=bool
arg=--pgr4_adaptive_vsync={value}
default=true
help=Immediate present with a 60 Hz host pacer, so dense views do not drop to 30 fps (NOTES 13).

[setting.resolution_scale]
group=Graphics
label=Resolution scale
type=choice
arg=--resolution_scale={value}
choices=1:1x (the game's own resolution)|2:2x (4x supersampling)|3:3x (9x supersampling)
default=1
help=The game's own EDRAM MSAA stays on at every scale. 2x costs about 10-15% fps on an RTX 4080-class GPU.

[setting.swap_post_effect]
group=Graphics
label=Post-process AA
type=choice
arg=--swap_post_effect={value}
choices=none:None|fxaa:FXAA|fxaa_extreme:FXAA (extreme)
default=fxaa

[setting.present_effect]
group=Graphics
label=Scaling to the window
type=choice
arg=--present_effect={value}
choices=bilinear:Bilinear|cas:CAS (sharpen)|fsr:FSR 1 (upscale + sharpen)
default=bilinear

[setting.anisotropic_override]
group=Graphics
label=Anisotropic filtering
type=choice
arg=--anisotropic_override={value}
choices=-1:Game default|0:Off|1:1x|2:2x|3:4x|4:8x|5:16x
default=5

[setting.log_level]
group=Logging
label=Log level
type=choice
arg=--log_level={value}
choices=trace:Trace|debug:Debug|info:Info|warn:Warnings|error:Errors|off:Off
default=info
help=Written to work\play.log.

[setting.hitch_ms]
group=Logging
label=Hitch log
type=choice
arg=--pgr4_hitch_ms={value}
choices=0:Off|25:Frames over 25 ms|33:Frames over 33 ms|50:Frames over 50 ms
default=25
help=Logs slow frames with a GPU / guest breakdown (scripts\hitch_stats.py summarises them).

; ---------------------------------------------------------------------------------------------
; First-time setup (the launcher's Setup page): the player's disc, the tools, the ReXGlue SDK, codegen, build.
[setup]
game_dir=assets
game_check=default.xex
game_sha1=1a7e3b9ee84ef5f3ea1db66e6b1e3eb4f96b0cdd
game_label=Your Project Gotham Racing 4 disc (2007, Xbox 360)
; Progress bar shares, roughly in minutes: extracting 6.2 GB, then the steps' weight= below.
game_weight=3
intro=The launcher builds Project Gotham Racing 4 from your own copy of the game: it puts the disc in assets\, builds the ReXGlue SDK next to this folder (..\_ext\rexglue-sdk), recompiles default.xex to C++ and compiles it. Expect 20-30 minutes and about 15 GB. Choose your disc image (.iso), or a folder that holds the extracted disc, then press Run setup.

[check.git]
label=Git for Windows
command=git --version
hint=Install Git for Windows from https://git-scm.com/download/win and run setup again.

; scripts\build.bat and build_sdk.bat use these install folders (README "Requirements").
[check.vs]
label=Visual Studio 2022 Community with the C++ workload
exists=%ProgramFiles%\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat
hint=Install Visual Studio 2022 Community with the "Desktop development with C++" workload (other editions: edit the paths at the top of scripts\build.bat and scripts\build_sdk.bat).

[check.llvm]
label=LLVM Clang 18+
exists=%ProgramFiles%\LLVM\bin\clang-cl.exe
hint=Install LLVM from https://github.com/llvm/llvm-project/releases into C:\Program Files\LLVM.

[check.cmake]
label=CMake 3.25+
exists=%ProgramFiles%\CMake\bin\cmake.exe
hint=Install CMake from https://cmake.org/download/ into C:\Program Files\CMake.

[step.sdk]
label=Get, patch and build the ReXGlue SDK v0.10.0
command=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\setup_sdk.ps1
success=SDK_READY
; The clone, then the SDK's Ninja build ([n/m] lines move the bar) up to SDK_READY.
progress=Cloning the ReXGlue SDK=0|Symlinks replaced=20|SDK_READY=100
weight=15

[step.codegen]
label=Recompile default.xex to C++
command=..\_ext\rexglue-sdk\out\install\win-amd64\bin\rexglue.exe codegen pgr4recomp_manifest.toml
skip_if=generated\default\codegen.stamp
weight=0.5

[step.build]
label=Build the game
command=scripts\build.bat
success=BUILD_OK
skip_if=out\build\win-amd64-release\pgr4recomp.exe
; Ninja's [n/m] lines move the bar.
weight=2
